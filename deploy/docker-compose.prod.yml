# Production overrides. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set real secrets in the environment (or a .env next to this file):
#   JWT_SECRET, SUPERADMIN_PASSWORD, LITELLM_MASTER_KEY, OPENAI_API_KEY,
#   ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, WORKOS_* etc.

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped

  litellm:
    restart: unless-stopped

  hub-server:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://hub:${POSTGRES_PASSWORD}@postgres:5432/hub
      DEV_SEED: "false"
      DEV_API_KEY: ${DEV_API_KEY:-}
      LOG_PROMPTS: "false"
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set a strong SUPERADMIN_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      # Real embeddings in prod (falls back to local hash if the dep is missing):
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-minilm}
      SSO_PROVIDER: ${SSO_PROVIDER:-dev}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
