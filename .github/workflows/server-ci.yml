name: Server CI

on:
  pull_request:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-ci.yml']
  push:
    branches: [main]
    paths: ['server/**']

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 5s --health-retries 20

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgres://hub:hub@localhost:5432/hub
      EMBEDDINGS_PROVIDER: local
      DEV_API_KEY: hub_ci_key
      PORT: '8080'
      ALLOW_INSECURE_DEFAULTS: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Migrate
        run: node dist/db/migrate.js

      - name: Integration tests
        run: npm test
