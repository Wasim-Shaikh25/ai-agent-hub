name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX contains runtime dependencies
        run: |
          unzip -l ai-agent-hub-*.vsix | grep -q "extension/node_modules/ajv/" || { echo "ERROR: .vsix missing ajv"; exit 1; }
          unzip -l ai-agent-hub-*.vsix | grep -q "extension/node_modules/mcp-proxy/" || { echo "ERROR: .vsix missing mcp-proxy"; exit 1; }
          unzip -l ai-agent-hub-*.vsix | grep -qE "extension/(PRODUCTION_READINESS|CHANGELOG|SECURITY|\.agents)" && { echo "ERROR: .vsix contains dev/audit files"; exit 1; } || true
